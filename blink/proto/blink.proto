syntax = "proto3";

import "proc/proc.proto";
import "sigmap/sigmap.proto";

option go_package = "sigmaos/blink/proto";

message RunBlinkProcReq {
  ProcProto proc              = 1;
  string    kid               = 2;
  string    procsrv_pid       = 3;
  string    spproxy_tcp_host  = 4;
  uint32    spproxy_tcp_port  = 5;
}

message RunBlinkProcRep {
  Rerror err = 1;
}
