syntax = "proto3";

import "rpc/proto/rpc.proto";

option go_package = "sigmaos/proxy/s3/proto";

message S3Req {
  string bucket = 1;
  string key = 2;
  bool cache = 3;
  Blob blob = 4;
  uint64 offset = 5; // chunked get: byte offset
  uint64 count = 6;  // chunked get: bytes to read (0 = whole object)
}

message S3Rep {
  bool oK = 1; 
  Blob blob = 2;
}
