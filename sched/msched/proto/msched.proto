syntax = "proto3";

import "proc/proc.proto";

option go_package = "sigmaos/sched/msched/proto";

message ForceRunReq {
  ProcProto procProto = 1;
  bool memAccountedFor = 2;
}

message ForceRunRep {
}

message WaitReq {
  string pidStr = 1;
  ProcSeqno procSeqno = 2;
}

message WaitRep {
  bytes status = 1;
}

message NotifyReq {
  string pidStr = 1;
  bytes status = 2;
}

message NotifyRep {
}

message GetCPUSharesReq {
}

message GetCPUSharesRep {
  map<string, int64> shares = 1;
}

message GetCPUUtilReq {
  string realmStr = 1;
}

message GetCPUUtilRep {
  // CPU used by the realm's procd containers on this node, as a percentage
  // where 100 means one full core.
  double util = 1;
  // CPU used by the whole node, in the same unit, regardless of realm: what
  // /proc/stat says, so it also covers the realm's ux/s3/chunkd servers and
  // everything in the root realm, none of which is in util.
  double nodeUtil = 2;
}

message GetMemReq {
}

message GetMemRep {
  // Memory (MB) this msched will still admit procs against. What besched
  // filters candidate nodes on, so a caller wanting to stop procs from landing
  // on this node has to drive this below the smallest mem request it cares
  // about.
  uint32 memFree = 1;
  // The machine's total memory (MB), for context: memFree is a budget, not a
  // measurement of what is in use.
  uint32 memTotal = 2;
}

message GetRunningProcsReq {
}

message GetRunningProcsRep {
  repeated ProcProto procProtos = 1;
}

message WarmCacheBinReq {
  string pidStr = 1;
  string realmStr = 2;
  string program = 3;
  repeated string SigmaPath = 4;
  int32 procType = 5;
}

message WarmCacheBinRep {
  bool oK = 1;
}

message RealmStats {
  int64 running = 1;
  int64 totalRan = 2;
  int64 totalErr = 3;
}

message GetMSchedStatsReq {
}

message GetMSchedStatsRep {
  map<string, RealmStats> mSchedStats = 1;
}
